# Maintainer overrides for scanner output.
#
# Use this file for stable corrections when the official page is clear but the
# automatic extractor is too conservative. Keep high-confidence, user-facing
# records in data/opportunities.yml instead.
#
# Schema:
# overrides:
#   - url: https://example.org/official-school
#     status: update        # update | exclude
#     note: Official page confirms the application deadline.
#     fields:
#       deadline: 2026-10-15
#       deadline_status: open
#       fee: 300 EUR
#       fee_eur: 300
#       deadline_evidence: Application deadline is 15 October 2026.
overrides:
  - url: https://www.utn.de/en/departments/department-computer-science-artificial-intelligence/nlu/computational-linguistics-fall-school-2026/
    status: update
    note: The official UTN programme section states that selected participants can receive scholarships covering the applicable registration fee; Deutschlandstipendium in the page footer is unrelated navigation/news content.
    fields:
      funding_available: true
      funding_type: [scholarship]
      funding_scope: registration fee covered
      funding_evidence: Thanks to the support of the associations GSCL and DGfS, scholarships covering the registration fee will be available for selected participants.
  - url: https://events.vtools.ieee.org/m/564683
    status: update
    note: The official IEEE announcement closed applications on 13 July; 31 July is registration/payment for accepted applicants, not an application deadline.
    fields:
      location: Abtei Frauenwörth, Chiemsee, Germany
      mode: in-person
      mode_evidence: Official IEEE event announcement gives an on-site venue at Abtei Frauenwörth, Chiemsee, Germany.
      deadline: 2026-07-13
      deadline_status: closed
      deadline_evidence: Applications were open until 13 July 2026; registration until 31 July is only for accepted applicants.
      funding_available: false
      funding_type: []
      funding_evidence: Participants must pay the applicable registration fee; creating an IEEE account free of charge is unrelated to the school fee.
      fee: Student registration USD 670–750; non-student registration USD 770–870
      fee_eur: 636.5
  - title_contains: Get to know the Bernstein Network
    status: exclude
    note: This is the research network homepage, not a seasonal school or short research-training programme.
  - title_contains: Karthaus summerschool
    status: update
    note: Official application page says applications for the 2027 course are not yet open.
    fields:
      deadline: null
      deadline_status: not_open
      deadline_evidence: Application for 2027 course is not yet open.
  - url: https://tinbergen.nl/event/2026/08/24/13256/applied-public-policy-evaluation
    status: update
    note: The official 2026 Summer School fee page states a EUR 1,000 student fee and does not offer Summer School participant funding.
    fields:
      funding_available: false
      funding_type: []
      funding_evidence: Tinbergen Summer School funding is not offered; scholarships described elsewhere apply to the two-year Research Master programme.
      fee: EUR 1,000 for PhD and Master students; accommodation and travel excluded
      fee_eur: 1000
