name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  site-integrity:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build from the last-known-good snapshot
        run: python -m research_school_radar.cli refresh-status --candidates-json data/latest_candidates.json
      - name: Match the public deployment surface
        shell: bash
        run: |
          rm -f \
            site/candidates.json \
            site/review_queue.json \
            site/translation-status.json \
            site/record-audit.json \
            site/semantic_chunks.json \
            site/ai_extractions.json \
            site/scan-manifest.json
      - name: Validate sitemap, language URLs, links and public API
        run: python -m research_school_radar.site_integrity --site-dir site
