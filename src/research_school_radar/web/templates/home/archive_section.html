<section class="programme-library" id="programme-library">
  <div class="section-head">
    <h2 data-i18n="library.title">Recurring programme library</h2>
    <p class="lead" data-i18n="library.lead">Verified past editions from official sources. These are not open applications; use them to discover recurring schools and watch for the next call.</p>
  </div>
  <p class="library-count"><span data-i18n="library.count">Showing verified recurring programmes</span> · {{ count }}</p>
  <div class="library-grid">{{ rows|safe }}</div>
</section>
