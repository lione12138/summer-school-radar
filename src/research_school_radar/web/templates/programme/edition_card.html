<article class="edition-card">
  <span class="library-status" data-i18n="{{ status_key }}">{{ status|safe }}</span>
  <h3>{{ title|safe }}</h3>
  <div class="edition-facts"><span>{{ dates|safe }}</span><span>{{ location|safe }}</span>{% if deadline %}<span>{{ deadline|safe }}</span>{% endif %}{% if sessions %}<span>{{ sessions|safe }}</span>{% endif %}</div>
  <p>{{ funding|safe }}</p>
  <div class="card-actions">
    {% if detail_href %}<a class="button primary" href="{{ detail_href }}" data-i18n="action.details">View details</a>{% endif %}
    {% if official_url %}<a class="button tonal" href="{{ official_url }}" target="_blank" rel="noopener" data-i18n="library.official">View official programme</a>{% endif %}
  </div>
</article>
