<article class="edition-card">
  <div class="programme-meta"><span>{{ latest_status|safe }}</span><span>{{ edition_count|safe }}</span></div>
  <h3><a href="{{ href }}">{{ title|safe }}</a></h3>
  <p class="muted">{{ organizer|safe }}</p>
  <p>{{ summary|safe }}</p>
  <a class="button tonal" href="{{ href }}" data-i18n="programme.view">View programme</a>
</article>
